@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
:root{--ink:#25153d;--purple:#652aa0;--pink:#a51c68;--yellow:#ffd23f;--nav:#101a52;--nav2:#19276d}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:linear-gradient(#66b9e8 0 58%,#8f8f93 58% 100%);color:var(--ink);font-family:"DotGothic16",system-ui,sans-serif}.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 42px}.brand{align-self:flex-start;color:#fff;background:var(--nav);border:2px solid #fff;outline:3px solid var(--nav);border-radius:3px;padding:8px 12px;font-size:12px;letter-spacing:.08em;box-shadow:4px 4px 0 rgba(37,21,61,.28)}.title{text-align:center;margin:50px 0 6px;font-size:clamp(30px,9vw,52px);line-height:1.15;text-shadow:3px 3px 0 rgba(255,255,255,.55)}.sub{text-align:center;margin:0 0 28px;font-size:13px;line-height:1.7}.roulette-card{width:min(540px,100%);background:#fff;border:2px solid var(--ink);outline:3px solid var(--purple);border-radius:8px;box-shadow:6px 6px 0 rgba(37,21,61,.22);padding:24px}.slot-frame{height:126px;overflow:hidden;position:relative;background:#0e1032;border:3px solid var(--ink);outline:2px solid #fff;border-radius:5px;box-shadow:inset 0 0 0 2px #505a99}.slot-list{position:absolute;left:0;top:0;width:100%;will-change:transform}.slot-item{height:120px;display:flex;align-items:center;justify-content:center;padding:0 14px;color:#fff;font-size:clamp(22px,7vw,34px);font-weight:900;text-align:center;word-break:break-word}.result{min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;margin:18px 0 4px;font-size:24px;font-weight:900;color:var(--pink)}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btn{appearance:none;border:2px solid var(--ink);outline:2px solid var(--ink);border-radius:4px;padding:12px 20px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;box-shadow:4px 4px 0 rgba(37,21,61,.28)}.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(37,21,61,.28)}.btn-main{background:var(--yellow);color:var(--ink)}.btn-stop{background:#e43d45;color:#fff}.btn-sub{background:#fff;color:var(--ink)}.hint{text-align:center;font-size:11px;opacity:.7;margin-top:16px}.setup-fab{position:fixed;right:16px;bottom:16px;z-index:15;background:var(--nav);color:#fff;border:2px solid #fff;outline:3px solid var(--nav);border-radius:3px;padding:11px 15px;font-family:inherit;font-size:13px;cursor:pointer;box-shadow:5px 5px 0 rgba(37,21,61,.35)}.overlay{position:fixed;inset:0;z-index:40;background:rgba(11,13,40,.58);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;transition:.15s}.overlay.open{opacity:1;visibility:visible}.menu-window{width:min(430px,100%);max-height:min(82svh,720px);overflow:auto;background:var(--nav);color:#fff;border:2px solid #fff;outline:3px solid var(--nav);border-radius:3px;padding:16px;box-shadow:0 0 0 1px #7e88b8 inset,7px 7px 0 rgba(37,21,61,.35);transform:translateY(-8px);transition:transform .15s}.overlay.open .menu-window{transform:translateY(0)}.window-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.window-title{margin:0;font-size:20px;letter-spacing:.06em}.close{appearance:none;background:transparent;color:#fff;border:2px solid #fff;width:34px;height:34px;font-family:inherit;font-size:18px;cursor:pointer}.lead{font-size:12px;line-height:1.7;margin:0 0 14px;color:#dbe1ff}.fields{display:grid;gap:9px}.field-row{display:grid;grid-template-columns:34px 1fr 36px;gap:8px;align-items:center}.num{text-align:center;color:#aeb8ef}.machine-input{width:100%;min-width:0;background:#fff;color:var(--ink);border:2px solid #fff;outline:2px solid transparent;border-radius:2px;padding:11px 12px;font-family:inherit;font-size:16px}.machine-input:focus{outline-color:var(--yellow)}.remove{appearance:none;background:var(--nav2);color:#fff;border:1px solid rgba(255,255,255,.35);height:40px;font-family:inherit;font-size:18px;cursor:pointer}.window-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.window-actions .btn{font-size:13px;padding:11px 8px;outline-color:#fff}.error{min-height:22px;color:#ffd23f;font-size:12px;margin:10px 0 0;text-align:center}.share{display:none;margin-top:12px;text-align:center}.share.show{display:block}.share a{display:inline-block;background:#111;color:#fff;border:2px solid var(--ink);padding:10px 16px;text-decoration:none;font-size:13px}.empty-state{color:#aeb8ef;font-size:14px}@media(max-width:520px){.page{padding-top:18px}.title{margin-top:38px}.roulette-card{padding:18px 14px}.slot-frame{height:116px}.slot-item{height:110px}.window-actions{grid-template-columns:1fr}.menu-window{padding:14px}.field-row{grid-template-columns:30px 1fr 34px}.machine-input{font-size:16px}}
</style></head><body>
<main class="page"><a class="brand" href="/">6択のワタリ OFFICIAL SITE</a><h1 class="title">何打つルーレット</h1><p class="sub">候補を入れて、今日打つ台を運に任せる。</p><section class="roulette-card" aria-label="何打つルーレット"><div class="slot-frame"><div class="slot-list" id="slotList"><div class="slot-item empty-state">候補を入力してください</div></div></div><div class="result" id="resultText">まずは候補台をセット</div><div class="actions"><button class="btn btn-main" id="spinBtn" type="button">START</button><button class="btn btn-sub" id="editBtn" type="button">候補を編集</button></div><div class="share" id="shareWrap"><a id="shareBtn" href="#" target="_blank" rel="noopener">結果をXでシェア</a></div><p class="hint">空欄は無視されます。2台以上でスタートできます。</p></section></main><button class="setup-fab" id="setupFab" type="button">候補台を設定</button>
<div class="overlay" id="setupOverlay" aria-hidden="true"><section class="menu-window" role="dialog" aria-modal="true" aria-labelledby="setupTitle"><div class="window-head"><h2 class="window-title" id="setupTitle">▶ 候補台を入力</h2><button class="close" id="closeSetup" type="button" aria-label="閉じる">×</button></div><p class="lead">打つか迷っているスロットの名前を入力してください。最初は6枠。必要なら追加できます。</p><div class="fields" id="fields"></div><div class="window-actions"><button class="btn btn-sub" id="addField" type="button">＋ 候補を追加</button><button class="btn btn-main" id="saveAndStart" type="button">これでルーレット</button></div><p class="error" id="setupError"></p></section></div>
<script src="./confetti.js"></script>
<script>(()=>{const STORAGE_KEY='watari6_naniutu_candidates_v1',MIN_FIELDS=6,MAX_FIELDS=20;const overlay=document.getElementById('setupOverlay'),fields=document.getElementById('fields'),setupError=document.getElementById('setupError'),slotList=document.getElementById('slotList'),spinBtn=document.getElementById('spinBtn'),resultText=document.getElementById('resultText'),shareWrap=document.getElementById('shareWrap'),shareBtn=document.getElementById('shareBtn');let candidates=loadCandidates(),running=false,stopping=false,animationId=null,position=0,speed=24,targetIndex=0;function itemHeight(){return matchMedia('(max-width:520px)').matches?110:120}function loadCandidates(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(p)?p.filter(v=>typeof v==='string'):[]}catch(_){return[]}}function saveCandidates(l){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(l))}catch(_){}}function addInput(value=''){if(fields.children.length>=MAX_FIELDS)return;const row=document.createElement('div');row.className='field-row';row.innerHTML='<span class="num"></span><input class="machine-input" type="text" maxlength="30" autocomplete="off" placeholder="機種名"><button class="remove" type="button" aria-label="この候補を削除">×</button>';row.querySelector('input').value=value;row.querySelector('.remove').addEventListener('click',()=>{if(fields.children.length<=2)return;row.remove();renumber()});fields.appendChild(row);renumber()}function renumber(){[...fields.children].forEach((r,i)=>r.querySelector('.num').textContent=String(i+1))}function buildFields(){fields.innerHTML='';const count=Math.max(MIN_FIELDS,candidates.length);for(let i=0;i<count;i++)addInput(candidates[i]||'')}function collect(){return[...fields.querySelectorAll('.machine-input')].map(i=>i.value.trim()).filter(Boolean)}function openSetup(){buildFields();setupError.textContent='';overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');setTimeout(()=>fields.querySelector('.machine-input')?.focus(),80)}function closeSetup(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')}function buildSlot(){slotList.innerHTML='';if(candidates.length<2){const d=document.createElement('div');d.className='slot-item empty-state';d.textContent='候補を入力してください';slotList.appendChild(d);return}for(let l=0;l<40;l++)candidates.forEach(name=>{const d=document.createElement('div');d.className='slot-item';d.textContent=name;slotList.appendChild(d)});position=0;render()}function render(){slotList.style.transform=`translateY(${position}px)`}function animate(){const h=itemHeight(),loop=candidates.length*h;position-=speed;if(position<=-loop)position+=loop;if(stopping){speed*=.972;if(speed<=.55){finishStop();return}}render();animationId=requestAnimationFrame(animate)}function finishStop(){cancelAnimationFrame(animationId);const h=itemHeight(),current=Math.abs(Math.round(position/h))%candidates.length;let diff=targetIndex-current;if(diff<0)diff+=candidates.length;position-=diff*h;position=Math.round(position/h)*h;render();const result=candidates[targetIndex];resultText.textContent=`今日は「${result}」！`;window.naniutuConfetti?.();shareBtn.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(`今日は「${result}」を打つ！！🎰\n#何打つルーレット\nhttps://www.watari6.com/contents/naniutu/`);shareWrap.classList.add('show');running=false;stopping=false;speed=24;spinBtn.textContent='START';spinBtn.classList.remove('btn-stop');spinBtn.classList.add('btn-main')}function startSpin(){if(candidates.length<2){openSetup();return}if(!running){running=true;stopping=false;speed=24;targetIndex=Math.floor(Math.random()*candidates.length);resultText.textContent='回転中…';shareWrap.classList.remove('show');spinBtn.textContent='STOP';spinBtn.classList.remove('btn-main');spinBtn.classList.add('btn-stop');animate()}else if(!stopping){stopping=true;spinBtn.textContent='STOPPING…'}}document.getElementById('addField').addEventListener('click',()=>{if(fields.children.length<MAX_FIELDS){addInput('');fields.lastElementChild?.querySelector('input')?.focus()}});document.getElementById('saveAndStart').addEventListener('click',()=>{const list=collect();if(list.length<2){setupError.textContent='2台以上入力してください。';return}candidates=list;saveCandidates(candidates);buildSlot();resultText.textContent=`${candidates.length}台から抽選します`;closeSetup()});document.getElementById('closeSetup').addEventListener('click',closeSetup);document.getElementById('editBtn').addEventListener('click',openSetup);document.getElementById('setupFab').addEventListener('click',openSetup);spinBtn.addEventListener('click',startSpin);overlay.addEventListener('click',e=>{if(e.target===overlay)closeSetup()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSetup()});buildSlot();if(candidates.length>=2)resultText.textContent=`${candidates.length}台から抽選します`;else openSetup()})();</script></body></html>
