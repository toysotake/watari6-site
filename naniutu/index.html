body{margin:0;background:#0c020d;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;color:white}.container{text-align:center;display:flex;flex-direction:column;align-items:center}.slot-frame{width:300px;height:120px;overflow:hidden;border:6px solid gold;border-radius:16px;position:relative;background:#000;box-shadow:0 0 20px rgba(255,215,0,.4)}.slot-frame.peka{animation:pekaFlash .15s infinite alternate}@keyframes pekaFlash{0%{box-shadow:0 0 20px gold,0 0 40px orange,0 0 80px yellow;background:#222}100%{box-shadow:0 0 40px #fff,0 0 80px gold,0 0 120px orange;background:#444}}.slot-list{position:absolute;width:100%;left:0;top:0}.item{width:100%;height:120px;display:flex;justify-content:center;align-items:center;font-size:34px;font-weight:bold}button{margin-top:30px;padding:16px 40px;font-size:24px;border:none;border-radius:12px;cursor:pointer;font-weight:bold;background:#00c853;color:white}button.stop{background:#d50000}.peka-text{margin-top:20px;height:60px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;color:#ff4dff;opacity:0;transition:.2s;text-shadow:0 0 10px #ff4dff,0 0 20px #ff4dff,0 0 40px #fff}.peka-text.show{opacity:1}.logo-area{width:100%;display:flex;justify-content:center;align-items:center;margin-bottom:30px}.title-logo{display:block;width:320px;max-width:90vw;height:auto;object-fit:contain}.share-btn{display:inline-block;margin-top:20px;padding:14px 28px;border-radius:12px;background:#1d9bf0;color:white;text-decoration:none;font-size:20px;font-weight:bold;transition:.2s;opacity:0;visibility:hidden}.share-btn.show{opacity:1;visibility:visible}.share-btn:hover{transform:scale(1.05)}

<div class="container"><div class="logo-area"><img src="logo.png" alt="タイトルロゴ" class="title-logo"></div><div class="slot-frame" id="slotFrame"><div class="slot-list" id="slotList"></div></div><div class="peka-text" id="pekaText">バンドリに決定!!</div><button id="toggleBtn">START</button><a id="shareBtn" class="share-btn" href="#" target="_blank">結果をXでシェア</a></div>
<script>
const items=["ジャグラー","かぐや様","マギレコ","バンドリ","ToLOVEる","SBJ","レールガン2","ゴブスレ"];const TARGET_INDEX=3;const slotList=document.getElementById("slotList");const slotFrame=document.getElementById("slotFrame");const pekaText=document.getElementById("pekaText");const shareBtn=document.getElementById("shareBtn");for(let i=0;i<50;i++){items.forEach(text=>{const div=document.createElement("div");div.className="item";div.textContent=text;slotList.appendChild(div)})}const ITEM_HEIGHT=120;const LOOP_HEIGHT=items.length*ITEM_HEIGHT;let position=0;let speed=22;let running=false;let stopping=false;let animationId;function render(){slotList.style.transform=`translateY(${position}px)`}function animate(){position-=speed;if(position<=-LOOP_HEIGHT){position+=LOOP_HEIGHT}if(stopping){speed*=.975;if(speed<=.5){finishStop();return}}render();animationId=requestAnimationFrame(animate)}function finishStop(){cancelAnimationFrame(animationId);let currentIndex=Math.abs(Math.round(position/ITEM_HEIGHT))%items.length;let diff=TARGET_INDEX-currentIndex;if(diff<0){diff+=items.length}position-=diff*ITEM_HEIGHT;position=Math.round(position/ITEM_HEIGHT)*ITEM_HEIGHT;render();slotFrame.classList.add("peka");pekaText.classList.add("show");const result="バンドリ";const shareText=`今日は「${result}」を打つ！！🎰\n#何打つルーレット\nhttps://www.watari6.com/naniutu/index2.html`;const shareUrl="https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText);shareBtn.href=shareUrl;shareBtn.classList.add("show");setTimeout(()=>{slotFrame.classList.remove("peka");pekaText.classList.remove("show")},2000);running=false;stopping=false;speed=22;button.textContent="START";button.classList.remove("stop")}const button=document.getElementById("toggleBtn");button.addEventListener("click",()=>{if(!running){running=true;stopping=false;slotFrame.classList.remove("peka");pekaText.classList.remove("show");button.textContent="STOP";button.classList.add("stop");animate()}else if(!stopping){stopping=true}});render();
</script>
